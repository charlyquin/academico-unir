name: academico

services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.academico.rule: "Host(`academico.entornolab.cloud`)"
      traefik.http.routers.academico.entrypoints: websecure
      traefik.http.routers.academico.tls: "true"
      traefik.http.routers.academico.tls.certresolver: letsencrypt
      traefik.http.routers.academico.service: academico
      traefik.http.services.academico.loadbalancer.server.port: "80"
